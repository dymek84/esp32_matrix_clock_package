[platformio]
default_envs = lolin32_lite

[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 115200
targets = compiledb
board_build.partitions = huge_app.csv
lib_deps =
  fastled/FastLED @ ^3.9.14
  adafruit/RTClib @ ^2.1.4
  bblanchon/ArduinoJson @ ^6.21.3
build_flags =
  -D CORE_DEBUG_LEVEL=0

